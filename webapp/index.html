<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aus Poll – Election Modelling Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/aus-poll/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="aus-poll is an open-source Australian federal election modelling dashboard. Track polls, model seat-by-seat outcomes, and explore swing scenarios for the 2025 Australian federal election." />
    <meta name="keywords" content="Australian election, election modelling, 2025 federal election, two-party preferred, seat projections, polling, ALP, Coalition, AEC, swing model" />
    <meta property="og:title" content="aus-poll – Australian Election Modelling Dashboard" />
    <meta property="og:description" content="Interactive seat-by-seat election modelling for the 2025 Australian federal election. Explore polls, swings, and scenarios." />
    <meta property="og:type" content="website" />
    <style>
      :root {
        --page-bg: #F4F1EA;
        --panel-bg: #FCFBF8;
        --metric-bg: #F6F4EE;
        --subtle-bg: #EFECE4;
        --table-head-bg: #FCFBF8;
        --table-row-alt: #F8F6F1;
        --row-highlight: #F7F2E4;
        --text-1: #1A1814;
        --text-2: #3D3A33;
        --text-3: #6E6A5F;
        --text-4: #98927F;
        --text-dark: #1A1814;
        --border-1: #E3DFD4;
        --border-2: #CFC9BA;
        --border-3: #ECE8DD;
        --header-bg: #1A1814;
        --header-fg: #F4F1EA;
        --header-muted: #A39E8D;
        --accent: #A8201A;
        --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
        --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --page-bg: #141310;
        --panel-bg: #1C1A16;
        --metric-bg: #211F1A;
        --subtle-bg: #262420;
        --table-head-bg: #1C1A16;
        --table-row-alt: #201E19;
        --row-highlight: #2A2620;
        --text-1: #ECE8DD;
        --text-2: #CFCABD;
        --text-3: #9A947F;
        --text-4: #6F6A5C;
        --text-dark: #ECE8DD;
        --border-1: #34312A;
        --border-2: #3E3A31;
        --border-3: #2A2722;
        --header-bg: #0F0E0C;
        --header-fg: #ECE8DD;
        --header-muted: #8A8573;
        --accent: #D4564B;
        color-scheme: dark;
      }
      html { background: var(--page-bg); font-family: var(--font-sans); }
      body { font-family: var(--font-sans); }
      *, *::before, *::after { box-sizing: border-box; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes growBar {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
