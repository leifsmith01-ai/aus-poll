name: Fetch Betting Odds

on:
  schedule:
    - cron: '0 1 * * *'  # Daily 01:00 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch betting odds
        env:
          BETFAIR_APP_KEY:       ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/betting_odds.py

      - name: Commit updated odds if changed
        run: |
          git diff --quiet data/polls/betting_odds.json && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polls/betting_odds.json
          git commit -m "chore: auto-refresh betting odds [skip ci]"
          git pull --rebase origin main
          git push
