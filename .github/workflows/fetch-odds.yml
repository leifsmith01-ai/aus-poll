name: Fetch Betting Odds

on:
  schedule:
    - cron: '0 1 * * *'  # Daily 01:00 UTC
  workflow_dispatch:

concurrency:
  group: data-autocommit

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch betting odds
        env:
          BETFAIR_APP_KEY:       ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
        # -m keeps the repo root on sys.path: run as a plain script, the
        # `from pipeline.config import BETTING_CONFIG` inside the Betfair tier
        # raises ModuleNotFoundError, which the broad except swallowed — so
        # Betfair silently degraded to Smarkets even with credentials set.
        run: python -m pipeline.betting_odds

      - name: Verify a live source was used
        # Fail red only when a fetch *errored* (bad key, quota, API change).
        # Smarkets needs no credentials, so the expected source is "smarkets"
        # (or betfair when its secrets are set). "APIs reachable but no
        # Australian election market listed" is a normal state between
        # election cycles — notice, not failure.
        run: |
          python - <<'EOF'
          import json, sys
          odds = json.load(open("data/polls/betting_odds.json"))
          source = odds.get("source")
          reason = odds.get("fallback_reason", "")
          print(f"betting odds source: {source}  fallback_reason: {reason or '-'}")
          if source == "manual" and reason.startswith("api_error"):
              print(f"::error::Betting odds fetch failed ({reason}) — check the API key/quota.")
              sys.exit(1)
          if source == "manual" and reason == "no_au_markets":
              print("::notice::Odds API reachable but no Australian election markets are listed — manual placeholder in use.")
          elif source == "manual":
              print("::notice::No betting API credentials configured — serving the manual placeholder.")
          EOF

      - name: Copy odds to frontend source
        run: cp data/polls/betting_odds.json webapp/src/data/betting_odds.json

      - name: Commit updated odds if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polls/betting_odds.json webapp/src/data/betting_odds.json
          git diff --cached --quiet && echo "Nothing changed — skipping commit." && exit 0
          git commit -m "chore: auto-refresh betting odds"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
