name: Update Poll Aggregation

on:
  push:
    branches: [main]
    paths:
      - 'data/polls/bludgertrack.json'
      - 'data/polls/vic_polls.json'
  schedule:
    - cron: '0 2 * * 1'  # Monday 02:00 UTC (noon AEST)
  workflow_dispatch:

# Serialise with the other auto-committing data workflows to avoid push races.
concurrency:
  group: data-autocommit

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Guard against self-triggering via the push-paths trigger now that the
    # auto-commit no longer carries [skip ci] (the deploy workflow must see it).
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install scraper + aggregator dependencies
        run: pip install requests beautifulsoup4

      - name: Show poll counts before scrape
        run: |
          python -c "
          import json
          fed = json.load(open('data/polls/bludgertrack.json'))
          vic = json.load(open('data/polls/vic_polls.json'))
          print(f'Federal polls before: {len(fed[\"polls\"])} (retrieved {fed.get(\"retrieved\",\"unknown\")})')
          print(f'VIC polls before: {len(vic[\"polls\"])}')
          "

      - name: Fetch latest polls from Wikipedia
        # Soft-fail: aggregator still runs on existing curated data if scrape fails.
        # Scraper now exits 1 when 0 records fetched (visible as failed step in UI).
        continue-on-error: true
        run: python scripts/update_poll_inputs.py -v

      - name: Show poll counts after scrape
        run: |
          python -c "
          import json
          fed = json.load(open('data/polls/bludgertrack.json'))
          vic = json.load(open('data/polls/vic_polls.json'))
          print(f'Federal polls after: {len(fed[\"polls\"])} (retrieved {fed.get(\"retrieved\",\"unknown\")})')
          print(f'VIC polls after: {len(vic[\"polls\"])}')
          "

      - name: Run federal poll aggregator
        run: python -m pipeline.poll_aggregator

      - name: Run VIC poll aggregator
        run: python -m pipeline.poll_aggregator --state vic

      - name: Copy poll data to frontend
        # data/polls/ is the single source of truth; the webapp copies are derived.
        # (vic_aggregated.json stays pipeline-side only — nothing imports it yet.)
        run: |
          cp data/polls/aggregated.json webapp/src/data/aggregated.json
          cp data/polls/leaders.json    webapp/src/data/leaders.json
          for st in nsw qld sa vic wa; do
            cp "data/polls/${st}_polls.json" "webapp/src/data/${st}_polls.json"
          done

      - name: Commit updated poll data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first, then inspect the index: `git diff` alone cannot see
          # newly created files, which previously made them uncommittable.
          git add \
            data/polls/bludgertrack.json \
            data/polls/vic_polls.json \
            data/polls/aggregated.json \
            data/polls/vic_aggregated.json \
            webapp/src/data/aggregated.json \
            webapp/src/data/leaders.json \
            webapp/src/data/nsw_polls.json \
            webapp/src/data/qld_polls.json \
            webapp/src/data/sa_polls.json \
            webapp/src/data/vic_polls.json \
            webapp/src/data/wa_polls.json
          git diff --cached --quiet && echo "Nothing changed — skipping commit." && exit 0

          git commit -m "chore: auto-fetch + regenerate polls"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
