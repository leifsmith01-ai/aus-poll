name: Update Poll Aggregation

on:
  push:
    branches: [main]
    paths:
      - 'data/polls/bludgertrack.json'
      - 'data/polls/vic_polls.json'
  schedule:
    - cron: '0 2 * * 1'  # Monday 02:00 UTC (noon AEST)
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run federal poll aggregator
        run: python -m pipeline.poll_aggregator

      - name: Run VIC poll aggregator
        run: python -m pipeline.poll_aggregator --state vic

      - name: Commit updated aggregations if changed
        run: |
          git diff --quiet data/polls/aggregated.json data/polls/vic_aggregated.json && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polls/aggregated.json data/polls/vic_aggregated.json
          git commit -m "chore: auto-regenerate aggregated polls [skip ci]"
          git pull --rebase origin main
          git push
