name: Generate State FP Constants

# Extracts per-district first-preference baselines from the SQLite DB for
# state elections and writes them to webapp/src/data/state_seat_fp.js as an
# ES module that App.jsx imports.
#
# Manual trigger only: state election results are static between elections,
# so there is nothing for a cron to pick up. Run this after a state election
# is loaded into the pipeline or after parser changes. (The previous monthly
# schedule spent a year re-deriving identical data — and reported success
# while every state download silently failed.)
#
# The output file is auto-committed. All state constants live in a single
# data module rather than inside App.jsx to keep the main file manageable.

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'State (vic / nsw / qld / wa / sa / nt / tas / act / all)'
        required: true
        default: 'all'
        type: choice
        options: [all, vic, nsw, qld, wa, sa, nt, tas, act]
      year:
        description: 'Election ID YYYYMM — leave blank for default per state'
        required: false
        default: ''

concurrency:
  group: data-autocommit

jobs:
  generate-fp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # VIC raw Excel files are stored in Git LFS; without this the
          # checkout leaves pointer stubs and the VIC parse produces nothing.
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pipeline dependencies
        run: pip install requests pandas openpyxl tqdm

      # Cache the SQLite DB between runs (path = config.DB_PATH).
      - name: Cache elections database
        uses: actions/cache@v4
        id: db-cache
        with:
          path: data/aec_elections.db
          key: state-elections-db-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            state-elections-db-${{ hashFiles('requirements.txt') }}-

      # ── Run the state pipeline to populate the SQLite DB ──────────────────
      - name: Run state pipeline
        env:
          INPUT_STATE: ${{ inputs.state || 'all' }}
          INPUT_YEAR:  ${{ inputs.year }}
        run: |
          declare -A DEFAULTS=(
            [vic]=202211 [nsw]=202303 [qld]=202410
            [wa]=202503  [sa]=202203  [nt]=202408
            [tas]=202403 [act]=202410
          )

          FAILED=()
          run_state() {
            local s=$1 y=$2
            echo "=== Running pipeline: state=$s year=$y ==="
            local log
            log=$(mktemp)
            python main.py --state "$s" --year "$y" 2>&1 | tee "$log"
            # main.py soft-continues on per-state errors (exit 0); surface them
            # here so a run that loaded no data cannot report success.
            if grep -qE "ERROR" "$log"; then
              FAILED+=("$s/$y")
            fi
          }

          if [ "$INPUT_STATE" = "all" ]; then
            for s in vic nsw qld wa sa nt tas act; do
              y="${INPUT_YEAR:-${DEFAULTS[$s]}}"
              run_state "$s" "$y"
            done
          else
            y="${INPUT_YEAR:-${DEFAULTS[$INPUT_STATE]}}"
            run_state "$INPUT_STATE" "$y"
          fi

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::State pipeline reported errors for: ${FAILED[*]} (downloads blocked or data missing)"
            exit 1
          fi

      # ── Generate JS module ────────────────────────────────────────────────
      # Exits non-zero (and refuses to write corrupt data) when the generated
      # FP map fails the degeneracy sanity check in generate_state_seat_fp.py.
      - name: Generate state FP module
        env:
          INPUT_STATE: ${{ inputs.state || 'all' }}
          INPUT_YEAR:  ${{ inputs.year }}
        run: |
          ARGS="--state ${INPUT_STATE} --output-module webapp/src/data/state_seat_fp.js"
          if [ -n "$INPUT_YEAR" ]; then
            ARGS="$ARGS --year $INPUT_YEAR"
          fi
          echo "Running: python scripts/generate_state_seat_fp.py $ARGS"
          python scripts/generate_state_seat_fp.py $ARGS

      # ── Auto-commit if changed ────────────────────────────────────────────
      - name: Commit changes if state FP data was updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/src/data/state_seat_fp.js
          git diff --cached --quiet && echo "Nothing changed — skipping commit." && exit 0

          git commit -m "chore: auto-update state seat FP baselines"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
