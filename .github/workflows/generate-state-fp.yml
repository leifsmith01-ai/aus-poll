name: Generate State FP Constants

# Extracts per-district first-preference baselines from the SQLite DB for
# state elections and writes them to webapp/src/data/state_seat_fp.js as an
# ES module that App.jsx imports.
#
# Schedule: 1st of each month at 05:00 UTC (1 hour after model constants).
# Also supports manual trigger with state/year inputs.
#
# The output file is auto-committed. All state constants live in a single
# data module rather than inside App.jsx to keep the main file manageable.

on:
  schedule:
    - cron: '0 5 1 * *'   # 1st of each month, 05:00 UTC
  workflow_dispatch:
    inputs:
      state:
        description: 'State (vic / nsw / qld / wa / sa / nt / tas / act / all)'
        required: true
        default: 'all'
        type: choice
        options: [all, vic, nsw, qld, wa, sa, nt, tas, act]
      year:
        description: 'Election ID YYYYMM — leave blank for default per state'
        required: false
        default: ''

jobs:
  generate-fp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pipeline dependencies
        run: pip install requests pandas openpyxl tqdm

      # Cache the SQLite DB between runs to avoid full re-download each month.
      - name: Cache elections database
        uses: actions/cache@v4
        id: db-cache
        with:
          path: data/elections.db
          key: state-elections-db-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            state-elections-db-${{ hashFiles('requirements.txt') }}-

      # ── Run the state pipeline to populate the SQLite DB ──────────────────
      - name: Run state pipeline
        env:
          INPUT_STATE: ${{ inputs.state || 'all' }}
          INPUT_YEAR:  ${{ inputs.year }}
        run: |
          declare -A DEFAULTS=(
            [vic]=202211 [nsw]=202303 [qld]=202410
            [wa]=202503  [sa]=202203  [nt]=202408
            [tas]=202403 [act]=202410
          )

          run_state() {
            local s=$1 y=$2
            echo "=== Running pipeline: state=$s year=$y ==="
            python main.py --state "$s" --year "$y"
          }

          if [ "$INPUT_STATE" = "all" ]; then
            for s in vic nsw qld wa sa nt tas act; do
              y="${INPUT_YEAR:-${DEFAULTS[$s]}}"
              run_state "$s" "$y"
            done
          else
            y="${INPUT_YEAR:-${DEFAULTS[$INPUT_STATE]}}"
            run_state "$INPUT_STATE" "$y"
          fi

      # ── Generate JS module ────────────────────────────────────────────────
      - name: Generate state FP module
        env:
          INPUT_STATE: ${{ inputs.state || 'all' }}
          INPUT_YEAR:  ${{ inputs.year }}
        run: |
          ARGS="--state ${INPUT_STATE} --output-module webapp/src/data/state_seat_fp.js"
          if [ -n "$INPUT_YEAR" ]; then
            ARGS="$ARGS --year $INPUT_YEAR"
          fi
          echo "Running: python scripts/generate_state_seat_fp.py $ARGS"
          python scripts/generate_state_seat_fp.py $ARGS

      # ── Auto-commit if changed ────────────────────────────────────────────
      - name: Commit changes if state FP data was updated
        run: |
          git diff --quiet webapp/src/data/state_seat_fp.js \
          && echo "Nothing changed — skipping commit." && exit 0

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/src/data/state_seat_fp.js
          git commit -m "chore: auto-update state seat FP baselines [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
