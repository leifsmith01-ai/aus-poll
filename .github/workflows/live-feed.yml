name: Live Feed Proxy

# Election-night proxy for the Live Results tab (webapp/src/live/).
#
# Polls the VEC server-side, turns the results into the live contract, and
# force-pushes the snapshot as the single-commit `live-feed` branch.
# raw.githubusercontent.com serves that file with `CORS: *`, and the
# dashboard's `vec_proxy_2026` source polls it.
#
# MODES
#   website        (default, election night) — scrapes the public VEC results
#                  website with scripts/fetch_live_vec_web.py. The site is
#                  CC BY 4.0 ("© Victorian Electoral Commission"), so a derived
#                  public snapshot is fine with attribution. Leave results_url
#                  at its default unless the VEC uses a different address; if
#                  that page is missing the script searches the state results
#                  landing page for the 2026 election.
#   rehearsal-2022 — fetches the real 2022 results website ONCE, then replays it
#                  as a night in progress (5% -> 100% of booths, early votes
#                  part-way, postals last). Labelled "TEST DATA" on the page.
#   rehearsal-feed — replays the VEC's sample data-feed files
#                  (tests/fixtures/vec_sample) through scripts/fetch_live_vec.py.
#   feed-url       — a directly downloadable VEC data-feed ZIP/XML (feed_url).
#
# AUTOMATIC ON THE NIGHT — nothing to start by hand. The schedule below (UTC;
# Melbourne is UTC+11 in late November) runs website mode:
#   Sat 28 Nov 17:41 AEDT  — long run, a pass every 5 min (~5h40m)
#   Sat 28 Nov 23:23 AEDT  — second long run (queues if the first is late)
#   29-30 Nov              — one pass every 2 hours (postal / declaration counting)
#   1-12 Dec               — one pass every 3 hours (rechecks, declarations)
# Cron has no year, so the job skips itself outside ELECTION_WINDOW below.
# Delete the schedule block after the election. A manual dispatch still works
# any time and cancels a running scheduled job.
#
# Load on the VEC: one pass is ~2 pages per district (~176 requests) with 4
# parallel requests; at the default 5-minute interval that is under one request
# a second. Do not lower the interval below a few minutes — the VEC only
# updates every 5 minutes anyway.
#
# Lag: VEC updates every 5 min, a pass takes ~1-2 min, and
# raw.githubusercontent.com caches for up to 5 min more (it ignores
# cache-busting query strings — tested).
#
# This never touches main; the live-feed branch is disposable afterwards.

on:
  schedule:
    - cron: "41 6 28 11 *"        # 17:41 AEDT election night — long run
    - cron: "23 12 28 11 *"       # 23:23 AEDT — second long run
    - cron: "17 */2 29,30 11 *"   # every 2h, Sun-Mon after the election
    - cron: "17 */3 1-12 12 *"    # every 3h for the following fortnight
  workflow_dispatch:
    inputs:
      mode:
        description: "Source"
        type: choice
        options: [website, rehearsal-2022, rehearsal-feed, feed-url]
        default: website
      results_url:
        description: "VEC results index (website mode)"
        required: false
        default: "https://www.vec.vic.gov.au/results/state-election-results/2026-state-election-results"
      feed_url:
        description: "Data-feed ZIP/XML URL (feed-url mode only)"
        required: false
        default: ""
      interval_seconds:
        description: "Seconds between passes (keep >= 180)"
        required: false
        default: "300"
      duration_minutes:
        description: "How long to keep polling (max ~350; job limit is 6h; 0 = one pass)"
        required: false
        default: "330"

env:
  # Scheduled runs only act inside this window (dates in UTC).
  ELECTION_WINDOW_START: "2026-11-28"
  ELECTION_WINDOW_END: "2026-12-13"

permissions:
  contents: write

concurrency:
  group: live-feed-proxy
  # A manual dispatch supersedes whatever is running; scheduled runs queue
  # behind each other so the second night run picks up when the first ends.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Skip scheduled runs outside the election window
        id: window
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = schedule ] && \
             { [[ "$today" < "$ELECTION_WINDOW_START" ]] || [[ "$today" > "$ELECTION_WINDOW_END" ]]; }; then
            echo "Outside the election window ($ELECTION_WINDOW_START to $ELECTION_WINDOW_END) — nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll, normalize, publish
        if: steps.window.outputs.run == 'true'
        env:
          MODE: ${{ inputs.mode || 'website' }}
          RESULTS_URL: ${{ inputs.results_url || 'https://www.vec.vic.gov.au/results/state-election-results/2026-state-election-results' }}
          FEED_URL: ${{ inputs.feed_url }}
          INTERVAL: ${{ inputs.interval_seconds || '300' }}
          # The two election-night schedules poll for ~5h40m; the later ones do one pass.
          DURATION_MIN: ${{ inputs.duration_minutes || ((github.event.schedule == '41 6 28 11 *' || github.event.schedule == '23 12 28 11 *') && '340' || '0') }}
          TOKEN: ${{ github.token }}
        run: bash scripts/live_feed_loop.sh
