name: Live Feed Proxy

# Election-night CORS proxy for the Live Results tab (webapp/src/live/).
#
# The browser cannot fetch the VEC results endpoint directly if it lacks CORS
# headers, so this workflow polls it server-side, normalizes the payload into
# the live contract (scripts/fetch_live_vec.py — all VEC-shape knowledge lives
# there), and force-pushes the snapshot as the single-commit `live-feed`
# branch. raw.githubusercontent.com serves that file with `CORS: *`, and the
# dashboard's `vec_proxy_2026` source polls it .
#
# REHEARSAL (works today): leave feed_url BLANK. The job steps through the
# VEC's published SE2026 sample snapshots (tests/fixtures/vec_sample — real
# feed format, fictitious data, 23 steps) through the full
# reader -> branch -> dashboard path. The page labels it "TEST DATA".
#
# ON THE NIGHT — NOT YET WIRED. The real feed is ZIP files on a SharePoint
# site behind a shared access token (VEC user guide, Sept 2026), not a plain
# URL. Still to do once access is granted:
#   1. add the download step (token from a repository SECRET, never an input —
#      inputs are printed in this public repo's logs), saving ZIPs to a folder
#      and calling `fetch_live_vec.py --dir <folder>`;
#   2. confirm with the VEC that publishing a derived snapshot on a public
#      branch is allowed (terms of use cl. 1.2 bars releasing the feed "in
#      either its original or any modified form").
# feed_url only works for a directly downloadable ZIP/XML.
#
# Lag: the VEC publishes every 5 minutes, and raw.githubusercontent.com caches
# for up to 5 more (it ignores cache-busting query strings — tested).
#
# This never touches main; the live-feed branch is disposable afterwards.

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: "Direct ZIP/XML URL (leave blank for the VEC-sample rehearsal)"
        required: false
        default: ""
      interval_seconds:
        description: "Seconds between fetches"
        required: false
        default: "90"
      duration_minutes:
        description: "How long to keep polling (max ~350; job limit is 6h)"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: live-feed-proxy
  cancel-in-progress: true    # a re-dispatch supersedes the running proxy

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Poll, normalize, publish
        env:
          FEED_URL: ${{ inputs.feed_url }}
          INTERVAL: ${{ inputs.interval_seconds }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          TOKEN: ${{ github.token }}
        run: |
          set -u
          deadline=$(( $(date +%s) + DURATION_MIN * 60 ))
          step=0
          failures=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ -n "$FEED_URL" ]; then
              src_args=(--url "$FEED_URL")
            else
              src_args=(--replay "$step" --replay-dir tests/fixtures/vec_sample --allow-partial)
            fi
            if python scripts/fetch_live_vec.py "${src_args[@]}" \
                 --out publish/live/vec-latest.json; then
              failures=0
              # `set -e` semantics inside the subshell so a failed push is not
              # silently reported as published; the snapshot self-heals on the
              # next interval, but the log must show it was lost.
              if (
                set -e
                cd publish
                rm -rf .git
                git init -q -b live-feed
                git -c user.name="github-actions[bot]" \
                    -c user.email="github-actions[bot]@users.noreply.github.com" \
                    add -A
                git -c user.name="github-actions[bot]" \
                    -c user.email="github-actions[bot]@users.noreply.github.com" \
                    commit -qm "live snapshot $(date -u +%FT%TZ)"
                git push -qf \
                  "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  live-feed
              ); then
                echo "$(date -u +%T) published step $step"
              else
                echo "::warning::push of snapshot $step failed — retrying on the next interval"
              fi
            else
              # Keep the previous good snapshot on the branch; back off a little.
              failures=$((failures + 1))
              echo "::warning::fetch/normalize failed (streak $failures) — keeping last good snapshot"
              sleep $(( INTERVAL < 60 ? INTERVAL : 60 ))
            fi
            step=$((step + 1))
            sleep "$INTERVAL"
          done
          echo "duration elapsed — re-dispatch to continue"
