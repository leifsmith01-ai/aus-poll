name: Live Feed Proxy

# Election-night proxy for the Live Results tab (webapp/src/live/).
#
# Polls the VEC server-side, turns the results into the live contract, and
# force-pushes the snapshot as the single-commit `live-feed` branch.
# raw.githubusercontent.com serves that file with `CORS: *`, and the
# dashboard's `vec_proxy_2026` source polls it.
#
# MODES
#   website        (default, election night) — scrapes the public VEC results
#                  website with scripts/fetch_live_vec_web.py. The site is
#                  CC BY 4.0 ("© Victorian Electoral Commission"), so a derived
#                  public snapshot is fine with attribution. Leave results_url
#                  at its default unless the VEC uses a different address; if
#                  that page is missing the script searches the state results
#                  landing page for the 2026 election.
#   rehearsal-2022 — fetches the real 2022 results website ONCE, then replays it
#                  as a night in progress (5% -> 100% of booths, early votes
#                  part-way, postals last). Labelled "TEST DATA" on the page.
#   rehearsal-feed — replays the VEC's sample data-feed files
#                  (tests/fixtures/vec_sample) through scripts/fetch_live_vec.py.
#   feed-url       — a directly downloadable VEC data-feed ZIP/XML (feed_url).
#
# On the night: Actions -> Live Feed Proxy -> Run workflow, mode = website.
# Re-dispatch when the 6-hour job limit ends a run.
#
# Load on the VEC: one pass is ~2 pages per district (~176 requests) with 4
# parallel requests; at the default 5-minute interval that is under one request
# a second. Do not lower the interval below a few minutes — the VEC only
# updates every 5 minutes anyway.
#
# Lag: VEC updates every 5 min, a pass takes ~1-2 min, and
# raw.githubusercontent.com caches for up to 5 min more (it ignores
# cache-busting query strings — tested).
#
# This never touches main; the live-feed branch is disposable afterwards.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Source"
        type: choice
        options: [website, rehearsal-2022, rehearsal-feed, feed-url]
        default: website
      results_url:
        description: "VEC results index (website mode)"
        required: false
        default: "https://www.vec.vic.gov.au/results/state-election-results/2026-state-election-results"
      feed_url:
        description: "Data-feed ZIP/XML URL (feed-url mode only)"
        required: false
        default: ""
      interval_seconds:
        description: "Seconds between passes (keep >= 180)"
        required: false
        default: "300"
      duration_minutes:
        description: "How long to keep polling (max ~350; job limit is 6h)"
        required: false
        default: "330"

permissions:
  contents: write

concurrency:
  group: live-feed-proxy
  cancel-in-progress: true    # a re-dispatch supersedes the running proxy

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Poll, normalize, publish
        env:
          MODE: ${{ inputs.mode }}
          RESULTS_URL: ${{ inputs.results_url }}
          FEED_URL: ${{ inputs.feed_url }}
          INTERVAL: ${{ inputs.interval_seconds }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ "$INTERVAL" -lt 60 ]; then INTERVAL=60; fi
          deadline=$(( $(date +%s) + DURATION_MIN * 60 ))
          out=publish/live/vec-latest.json
          mkdir -p work publish/live
          # Rehearsal-2022 steps through the night at these fractions, then holds.
          reveal=(0.05 0.1 0.2 0.3 0.45 0.6 0.75 0.9 1.0)
          step=0
          failures=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            case "$MODE" in
              website)
                cmd=(python scripts/fetch_live_vec_web.py --index "$RESULTS_URL"
                     --cache work/urls.json --previous work/last-good.json --out "$out") ;;
              rehearsal-2022)
                if [ ! -f work/html22/urls.json ]; then
                  python scripts/fetch_live_vec_web.py \
                    --index https://www.vec.vic.gov.au/results/state-election-results/2022-state-election-results \
                    --save-html work/html22 --rehearsal --out /dev/null || true
                fi
                i=$(( step < ${#reveal[@]} ? step : ${#reveal[@]} - 1 ))
                cmd=(python scripts/fetch_live_vec_web.py --from-html work/html22 --rehearsal
                     --reveal "${reveal[$i]}" --out "$out") ;;
              rehearsal-feed)
                cmd=(python scripts/fetch_live_vec.py --replay "$step"
                     --replay-dir tests/fixtures/vec_sample --allow-partial --out "$out") ;;
              feed-url)
                cmd=(python scripts/fetch_live_vec.py --url "$FEED_URL" --out "$out") ;;
              *) echo "::error::unknown mode $MODE"; exit 1 ;;
            esac
            if "${cmd[@]}"; then
              failures=0
              cp "$out" work/last-good.json
              # `set -e` inside the subshell so a failed push is not silently
              # reported as published; the next pass self-heals, but the log
              # must show it was lost.
              if (
                set -e
                cd publish
                rm -rf .git
                git init -q -b live-feed
                git -c user.name="github-actions[bot]" \
                    -c user.email="github-actions[bot]@users.noreply.github.com" \
                    add -A
                git -c user.name="github-actions[bot]" \
                    -c user.email="github-actions[bot]@users.noreply.github.com" \
                    commit -qm "live snapshot $(date -u +%FT%TZ)"
                git push -qf \
                  "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  live-feed
              ); then
                echo "$(date -u +%T) published step $step"
              else
                echo "::warning::push of snapshot $step failed — retrying on the next pass"
              fi
            else
              # Keep the previous good snapshot on the branch (e.g. before the VEC
              # publishes the results index at 6pm, or a page failed validation).
              failures=$((failures + 1))
              cp work/last-good.json "$out" 2>/dev/null || true
              echo "::warning::fetch/normalize failed (streak $failures) — keeping last good snapshot"
            fi
            step=$((step + 1))
            sleep "$INTERVAL"
          done
          echo "duration elapsed — re-dispatch to continue"
