name: Data Health Check

# Weekly freshness assertions over the auto-updated datasets. A red run here
# (which GitHub emails to watchers) is the alert that one of the scheduled
# data workflows has silently stopped delivering — the failure mode that
# previously went unnoticed for months (update-model-constants failed twice;
# generate-state-fp no-opped green; betting odds served a manual placeholder).
#
# This job never commits anything.

on:
  schedule:
    - cron: '0 3 * * 2'   # Tuesday 03:00 UTC (day after the Monday poll update)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check dataset freshness
        env:
          # Presence only — used to decide whether manual betting odds is an error.
          HAS_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY != '' }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from datetime import date, timedelta

          failures = []
          warnings = []

          def age_days(stamp):
              return (date.today() - date.fromisoformat(stamp)).days

          # Federal polls: the scraper fetches from Wikipedia weekly and stamps
          # 'retrieved' on every successful fetch — even a week with no new poll —
          # so a stale stamp means the scrape itself stopped, not merely a quiet
          # polling stretch.
          fed = json.load(open("data/polls/bludgertrack.json"))
          if age_days(fed["retrieved"]) > 10:
              failures.append(f"bludgertrack.json retrieved {fed['retrieved']} (>10 days old) — weekly poll scrape is not landing")

          # Aggregator: 'generated' is the data-as-of date (newest poll folded
          # in), not a run timestamp, so it legitimately stops advancing between
          # polls. The aggregator runs right after the scrape, so it is healthy
          # as long as it reflects the newest poll we actually hold; lagging
          # behind that means the aggregator step silently stopped while the
          # scrape kept landing.
          agg = json.load(open("data/polls/aggregated.json"))
          newest_fed = max(p["date"] for p in fed["polls"])
          if agg["generated"] < newest_fed:
              failures.append(f"aggregated.json generated {agg['generated']} is behind newest poll {newest_fed} — poll aggregator is not landing")

          # Value plausibility: freshness alone once let mis-parsed Wikipedia
          # rows (ALP primary 98, subsample 2PPs of 64) sit in the source files
          # behind green runs. The scraper now rejects such rows up front; this
          # asserts none slipped through (e.g. via a manual edit).
          sys.path.insert(0, ".")
          from pipeline.poll_validation import poll_implausibility
          for p in fed["polls"]:
              reason = poll_implausibility(p, kind="federal")
              if reason:
                  failures.append(f"bludgertrack.json has an implausible poll ({p.get('pollster')} {p.get('date')}): {reason}")

          # The published aggregate itself must stay poll-shaped: trend/current
          # ALP 2PP within 40-60 and no zero-width confidence band.
          points = [t["tpp_eff"] for t in agg.get("trend", []) if t.get("tpp_eff")]
          if agg.get("current", {}).get("tpp_eff"):
              points.append(agg["current"]["tpp_eff"])
          for pt in points:
              if not (40 <= pt["mean"] <= 60):
                  failures.append(f"aggregated.json has an implausible ALP 2PP point ({pt['mean']}) — corrupt poll input?")
                  break
          if any(pt["lo95"] == pt["hi95"] for pt in points):
              failures.append("aggregated.json has a zero-width 95% band — variance floor is not being applied")

          # Webapp copies: the page renders from webapp/src/data/, not from
          # data/polls/. Fresh source files behind stale webapp copies kept the
          # published site weeks out of date while every check above stayed
          # green — assert the derived copies are byte-identical to the source.
          for name in ("bludgertrack.json", "aggregated.json", "leaders.json",
                       "nsw_polls.json", "qld_polls.json", "sa_polls.json",
                       "vic_polls.json", "wa_polls.json"):
              src = open(f"data/polls/{name}", "rb").read()
              dst_path = f"webapp/src/data/{name}"
              if not os.path.exists(dst_path):
                  failures.append(f"{dst_path} is missing — update-polls.yml is not copying it to the frontend")
              elif open(dst_path, "rb").read() != src:
                  failures.append(f"{dst_path} differs from data/polls/{name} — the webapp copy step is not landing, the page is serving stale polls")

          # VIC polls: until the 28 Nov 2026 election a long gap is treated as a
          # FAILURE — the scrape once rotted silently for 4.5 months behind green
          # runs because this was only a warning. After the election it reverts
          # to a warning (long quiet stretches are normal between cycles).
          VIC_ELECTION_DAY = date(2026, 11, 28)
          vic = json.load(open("data/polls/vic_polls.json"))
          for p in vic["polls"]:
              reason = poll_implausibility(p, kind="state")
              if reason:
                  failures.append(f"vic_polls.json has an implausible poll ({p.get('pollster')} {p.get('date')}): {reason}")
          newest_vic = max(p["date"] for p in vic["polls"])
          if age_days(newest_vic) > 56:
              msg = f"newest VIC poll is {newest_vic} (>8 weeks old) — check the Wikipedia scraper's VIC table parsing"
              if date.today() <= VIC_ELECTION_DAY:
                  failures.append(msg + " (hard failure until the 2026 VIC election)")
              else:
                  warnings.append(msg)

          # Other state polls (NSW/QLD/WA/SA): plausibility is asserted, but
          # staleness is only a warning — state polling is sparse and three of
          # the four states don't yet have a Wikipedia polling page to scrape.
          for st in ("nsw", "qld", "wa", "sa"):
              data = json.load(open(f"data/polls/{st}_polls.json"))
              for p in data["polls"]:
                  reason = poll_implausibility(p, kind="state")
                  if reason:
                      failures.append(f"{st}_polls.json has an implausible poll ({p.get('pollster')} {p.get('date')}): {reason}")
              real = [p for p in data["polls"] if "election" not in (p.get("pollster") or "").lower()]
              if real:
                  newest = max(p["date"] for p in real)
                  if age_days(newest) > 120:
                      warnings.append(f"newest {st.upper()} poll is {newest} (>17 weeks old) — scrape may have stopped, or polling is just quiet")

          # Betting odds: a manual placeholder caused by an API *error* is a failure;
          # "no Australian markets listed" is a normal between-cycles state.
          odds = json.load(open("data/polls/betting_odds.json"))
          if odds.get("source") == "manual":
              reason = odds.get("fallback_reason", "")
              if reason.startswith("api_error"):
                  failures.append(f"betting odds fetch is failing ({reason}) — check the API key/quota")
              elif reason == "no_au_markets":
                  warnings.append("betting odds: API reachable but no Australian election markets listed (manual placeholder in use)")
              elif os.environ.get("HAS_ODDS_API_KEY") == "true":
                  failures.append("betting_odds.json source is 'manual' despite ODDS_API_KEY being configured — the daily odds fetch is failing")
              else:
                  warnings.append("betting odds are the manual placeholder (no ODDS_API_KEY configured)")

          # Economics: ABS/RBA indicators refresh monthly.
          eco = json.load(open("data/economics.json"))
          if age_days(eco["generated"]) > 90:
              failures.append(f"economics.json generated {eco['generated']} (>90 days old) — economics refresh is not landing")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a") as f:
              f.write("## Data health\n")
              for w in warnings:
                  f.write(f"- :warning: {w}\n")
              for x in failures:
                  f.write(f"- :x: {x}\n")
              if not warnings and not failures:
                  f.write("- :white_check_mark: all tracked datasets fresh\n")

          for w in warnings:
              print(f"::warning::{w}")
          for x in failures:
              print(f"::error::{x}")
          if failures:
              sys.exit(1)
          print("All tracked datasets fresh.")
          EOF
