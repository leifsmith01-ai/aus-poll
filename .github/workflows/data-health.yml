name: Data Health Check

# Weekly freshness assertions over the auto-updated datasets. A red run here
# (which GitHub emails to watchers) is the alert that one of the scheduled
# data workflows has silently stopped delivering — the failure mode that
# previously went unnoticed for months (update-model-constants failed twice;
# generate-state-fp no-opped green; betting odds served a manual placeholder).
#
# This job never commits anything.

on:
  schedule:
    - cron: '0 3 * * 2'   # Tuesday 03:00 UTC (day after the Monday poll update)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check dataset freshness
        env:
          # Presence only — used to decide whether manual betting odds is an error.
          HAS_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY != '' }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from datetime import date, timedelta

          failures = []
          warnings = []

          def age_days(stamp):
              return (date.today() - date.fromisoformat(stamp)).days

          # Federal polls: the scraper fetches from Wikipedia weekly and stamps
          # 'retrieved' on every successful fetch — even a week with no new poll —
          # so a stale stamp means the scrape itself stopped, not merely a quiet
          # polling stretch.
          fed = json.load(open("data/polls/bludgertrack.json"))
          if age_days(fed["retrieved"]) > 10:
              failures.append(f"bludgertrack.json retrieved {fed['retrieved']} (>10 days old) — weekly poll scrape is not landing")

          # Aggregator: 'generated' is the data-as-of date (newest poll folded
          # in), not a run timestamp, so it legitimately stops advancing between
          # polls. The aggregator runs right after the scrape, so it is healthy
          # as long as it reflects the newest poll we actually hold; lagging
          # behind that means the aggregator step silently stopped while the
          # scrape kept landing.
          agg = json.load(open("data/polls/aggregated.json"))
          newest_fed = max(p["date"] for p in fed["polls"])
          if agg["generated"] < newest_fed:
              failures.append(f"aggregated.json generated {agg['generated']} is behind newest poll {newest_fed} — poll aggregator is not landing")

          # VIC polls: a long gap is suspicious in a VIC election year but can be real.
          vic = json.load(open("data/polls/vic_polls.json"))
          newest_vic = max(p["date"] for p in vic["polls"])
          if age_days(newest_vic) > 56:
              warnings.append(f"newest VIC poll is {newest_vic} (>8 weeks old) — check the Wikipedia scraper's VIC table parsing")

          # Betting odds: a manual placeholder caused by an API *error* is a failure;
          # "no Australian markets listed" is a normal between-cycles state.
          odds = json.load(open("data/polls/betting_odds.json"))
          if odds.get("source") == "manual":
              reason = odds.get("fallback_reason", "")
              if reason.startswith("api_error"):
                  failures.append(f"betting odds fetch is failing ({reason}) — check the API key/quota")
              elif reason == "no_au_markets":
                  warnings.append("betting odds: API reachable but no Australian election markets listed (manual placeholder in use)")
              elif os.environ.get("HAS_ODDS_API_KEY") == "true":
                  failures.append("betting_odds.json source is 'manual' despite ODDS_API_KEY being configured — the daily odds fetch is failing")
              else:
                  warnings.append("betting odds are the manual placeholder (no ODDS_API_KEY configured)")

          # Economics: ABS/RBA indicators refresh monthly.
          eco = json.load(open("data/economics.json"))
          if age_days(eco["generated"]) > 90:
              failures.append(f"economics.json generated {eco['generated']} (>90 days old) — economics refresh is not landing")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a") as f:
              f.write("## Data health\n")
              for w in warnings:
                  f.write(f"- :warning: {w}\n")
              for x in failures:
                  f.write(f"- :x: {x}\n")
              if not warnings and not failures:
                  f.write("- :white_check_mark: all tracked datasets fresh\n")

          for w in warnings:
              print(f"::warning::{w}")
          for x in failures:
              print(f"::error::{x}")
          if failures:
              sys.exit(1)
          print("All tracked datasets fresh.")
          EOF
